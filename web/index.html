<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyThings</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<header class="topbar">
  <div>
    <h1>MyThings</h1>
    <p>Простой каталог вещей</p>
  </div>
  <button id="open-item-form" class="primary">+ Добавить предмет</button>
</header>

<main class="layout">
  <aside class="sidebar">
    <section class="panel">
      <h2>Фильтры</h2>
      <form id="filters-form" class="stack">
        <label>
          Название
          <input id="filter-name" type="search" placeholder="Например, часы">
        </label>
        <label>
          Теги
          <select id="filter-tags" multiple size="6"></select>
        </label>
        <div class="row">
          <label>
            Цена от
            <input id="filter-min-price" type="number" min="0" placeholder="0">
          </label>
          <label>
            Цена до
            <input id="filter-max-price" type="number" min="0" placeholder="">
          </label>
        </div>
        <div class="row actions">
          <button class="primary" type="submit">Применить</button>
          <button id="reset-filters" class="secondary" type="button">Сбросить</button>
        </div>
      </form>
    </section>

    <section class="panel">
      <div class="section-head">
        <h2>Теги</h2>
      </div>
      <form id="tag-form" class="inline-form">
        <input id="tag-name" placeholder="Новый тег" required>
        <button class="primary" type="submit">+</button>
      </form>
      <div id="tags-list" class="tags-list"></div>
    </section>
  </aside>

  <section class="content">
    <div class="section-head">
      <div>
        <h2>Предметы</h2>
        <span id="items-status" class="muted"></span>
      </div>
    </div>
    <div id="items-grid" class="items-grid"></div>
    <div id="empty-state" class="empty hidden">Ничего не найдено</div>
  </section>
</main>

<dialog id="item-dialog">
  <form id="item-form" method="dialog" class="dialog-form">
    <div class="dialog-head">
      <h2 id="item-dialog-title">Новый предмет</h2>
      <button id="close-item-form" class="icon-button" type="button" aria-label="Закрыть">×</button>
    </div>

    <input id="item-id" type="hidden">

    <label>
      Название
      <input id="item-name" required maxlength="255">
    </label>

    <label>
      Описание
      <textarea id="item-description" rows="4"></textarea>
    </label>

    <label>
      Ссылка на изображение
      <input id="item-image-url" type="url" placeholder="https://...">
    </label>

    <label>
      Цена
      <input id="item-price" type="number" min="0" value="0" required>
    </label>

    <label>
      Атрибуты (JSON)
      <textarea id="item-attributes" rows="5" spellcheck="false" placeholder='{"brand":"Longines","year":1900}'>{}</textarea>
    </label>

    <div class="dialog-actions">
      <button id="cancel-item" class="secondary" type="button">Отмена</button>
      <button class="primary" type="submit">Сохранить</button>
    </div>
  </form>
</dialog>

<dialog id="tags-dialog">
  <div class="dialog-form">
    <div class="dialog-head">
      <h2>Теги предмета</h2>
      <button id="close-tags-dialog" class="icon-button" type="button">×</button>
    </div>
    <p id="tags-item-title" class="muted"></p>
    <input id="tags-item-id" type="hidden">
    <div id="assign-tags-list" class="assign-tags-list"></div>
    <p class="muted small">Кнопка меняет связь предмета и тега через POST/DELETE.</p>
  </div>
</dialog>

<div id="toast" class="toast hidden"></div>
<script src="/static/app.js" defer></script>
</body>
</html>
