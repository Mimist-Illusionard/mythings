services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mythings-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_NAME: mythings
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASS: postgres
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/web/uploads

  postgres:
    image: postgres:17-alpine
    container_name: mythings-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mythings
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mythings"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
  uploads_data:
